<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>员工信息后台</title>
    <script>
      (() => {
        let savedTheme = null;
        try {
          savedTheme = window.localStorage.getItem("comeover-admin-theme") ?? window.localStorage.getItem("employee-portal-theme");
        } catch {
          // Storage may be unavailable in privacy-restricted browser contexts.
        }
        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>
      :root { --page:#f4f7fb;--surface:#fff;--soft:#f5f7fa;--ink:#17202a;--muted:#697483;--line:#e3e8ef;--brand:#007aff;--brand-soft:#eaf3ff;--danger:#c5352b;--success:#217a4a;--warning:#9a6700;--shadow:0 12px 40px #1c2d4808;color-scheme:light }
      :root[data-theme="dark"] { --page:#0f1115;--surface:#1d2026;--soft:#262a31;--ink:#f1f4f8;--muted:#a4adba;--line:#343942;--brand:#72b5ff;--brand-soft:#23354c;--danger:#ff8e86;--success:#78d59e;--warning:#ffd36a;--shadow:none;color-scheme:dark }
      * { box-sizing:border-box }
      body { margin:0;background:var(--page);color:var(--ink);font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased }
      button, input, select { font:inherit }
      button { cursor:pointer;color:inherit }
      button, a, input, select { -webkit-tap-highlight-color:transparent }
      button { border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:36px;padding:7px 12px;font-size:13px;font-weight:500;transition:background .15s,border-color .15s }
      button:hover { background:var(--soft);border-color:#b2c5dd }
      button:disabled { opacity:.38;cursor:not-allowed }
      button:focus-visible, a:focus-visible { outline:3px solid #007aff55;outline-offset:2px }
      input, select { min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);height:40px;padding:0 12px;outline:0 }
      input:focus, select:focus { border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft) }
      input::placeholder { color:#929ca8 }
      h1, h2, h3, p { margin:0 }
      svg { width:20px;height:20px;flex-shrink:0 }
      .muted { color:var(--muted) }
      .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:.015em }
      .flex { display:flex;align-items:center;gap:10px }
      .quiet { border-color:transparent;background:transparent }
      .primary { color:#fff;background:#007aff;border-color:#007aff }
      .primary:hover { background:#0069dc;border-color:#0069dc }
      .danger { color:var(--danger) }
      .small { font-size:12px }
      .shell { width:min(1440px,100% - 64px);margin:0 auto;padding:22px 0 30px }
      .topbar { height:58px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow) }
      .page-heading { display:flex;align-items:center;justify-content:space-between;gap:20px;padding:32px 2px 26px }
      h1 { font-size:28px;letter-spacing:-.04em;font-weight:650 }
      .page-heading p { font-size:13px;color:var(--muted);margin-top:8px }
      .heading-meta { font-size:12px;color:var(--muted) }
      .heading-meta strong { font-weight:600;color:var(--ink) }
      .workspace { background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden }
      .workspace-tabs { display:flex;justify-content:space-between;align-items:center;height:62px;padding:0 23px;border-bottom:1px solid var(--line) }
      .tabs { display:flex;gap:26px;height:100%;align-items:stretch }
      .tab { position:relative;border:0;border-radius:0;background:transparent;padding:0 1px;color:var(--muted);display:flex;gap:8px;align-items:center;font-size:14px }
      .tab:hover { background:transparent;color:var(--ink) }
      .tab.active { color:var(--brand);font-weight:650 }
      .tab.active:after { content:"";height:2px;background:var(--brand);position:absolute;bottom:-1px;left:0;right:0 }
      .count { font-size:11px;background:var(--soft);border-radius:5px;padding:2px 6px;min-width:23px;text-align:center;color:var(--muted) }
      .tab.active .count { background:var(--brand-soft);color:var(--brand) }
      .refresh { color:var(--muted);font-size:12px }
      .toolbar { display:flex;align-items:center;gap:10px;padding:20px 23px }
      .search { position:relative;width:340px;max-width:100% }
      .search input { width:100%;padding-left:35px;padding-right:28px;background:var(--soft);border-color:transparent }
      .search-mark { position:absolute;left:13px;top:12px;width:13px;height:13px;border:1.5px solid #8793a4;border-radius:50%;pointer-events:none }
      .search-mark:after { content:"";height:5px;width:1.5px;background:#8793a4;transform:rotate(-42deg);position:absolute;right:-3px;bottom:-4px }
      .search-clear { position:absolute;right:4px;top:3px;min-height:32px;padding:2px 6px;font-size:17px }
      .toolbar select { min-width:146px }
      .toolbar-end { margin-left:auto;font-size:12px;color:var(--muted) }
      .filter-toggle { display:none }
      .table-scroll { overflow:auto }
      table { border-collapse:collapse;width:100%;table-layout:fixed }
      th { font-size:12px;font-weight:500;text-align:left;color:var(--muted);background:var(--soft);height:40px;padding:0 20px }
      td { padding:17px 20px;border-bottom:1px solid var(--line);height:78px;vertical-align:middle;font-size:13px }
      th:first-child, td:first-child { padding-left:24px }
      tbody tr:last-child td { border-bottom:0 }
      tbody tr:hover { background:color-mix(in srgb,var(--brand-soft) 45%,var(--surface)) }
      .person { display:flex;gap:11px;align-items:center;min-width:0 }
      .person > div { min-width:0 }
      .name { max-width:100%;overflow-wrap:anywhere }
      .row-actions button { white-space:nowrap }
      .avatar { width:35px;height:35px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:#5c6b81;font-size:13px;font-weight:500;flex-shrink:0 }
      :root[data-theme="dark"] .avatar { color:#bfd0e7 }
      .name { font-size:14px;font-weight:600;border:0;background:transparent;border-radius:3px;min-height:0;padding:0;text-align:left }
      .name:hover { background:transparent;color:var(--brand) }
      .subline { margin-top:6px;font-size:11px;color:var(--muted) }
      .store-name { display:flex;gap:7px;align-items:center;font-size:13px }
      .store-dot { width:6px;height:6px;border-radius:50%;background:#658bc9 }
      .store-dot.peanut { background:#d49e51 }
      .doc-link { border:0;background:transparent;padding:0;min-height:0;text-align:left;color:var(--ink);font-size:12px }
      .doc-link:hover { background:transparent;color:var(--brand) }
      .doc-ok { color:var(--success);font-size:12px;margin-right:5px }
      .doc-sub { font-size:11px;margin-top:7px;color:var(--muted) }
      .doc-sub.uploaded { color:var(--success) }
      .row-actions { display:flex;gap:3px;justify-content:flex-end;align-items:center }
      .row-actions .edit { border-color:transparent;background:transparent;color:var(--brand);font-size:12px;padding:6px }
      .more { font-size:19px;letter-spacing:1px;padding:1px 6px;min-width:30px }
      .foot { border-top:1px solid var(--line);padding:15px 23px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px }
      .pagination { display:flex;gap:7px;align-items:center }
      .pagination select { height:32px;font-size:12px;padding:0 8px }
      .pagination button { min-height:32px;padding:5px 11px }
      .pagination .current { color:var(--brand);border-color:#c1daff;background:var(--brand-soft) }
      .footer-note { display:flex;justify-content:space-between;gap:16px;padding:18px 3px;font-size:11px;color:var(--muted) }
      .empty { padding:65px 20px;text-align:center;color:var(--muted) }
      .empty h3 { font-weight:550;font-size:17px;color:var(--ink);margin-bottom:8px }
      .empty button { margin-top:18px }
      .close { font-size:23px;font-weight:300;padding:2px 9px }
      .section-title { font-weight:650;font-size:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:22px }
      .info-grid { display:grid;grid-template-columns:1fr 1fr;gap:24px 32px }
      .info-cell label { display:block;color:var(--muted);font-size:12px;margin-bottom:8px }
      .info-cell p { font-size:14px }
      .info-cell.full { grid-column:1/-1 }
      .info-cell input, .info-cell select { width:100% }
      .section-break { border:0;border-top:1px solid var(--line);margin:30px 0 26px }
      .link { color:var(--brand);font-size:12px;border:0;background:transparent }
      .drawer-footer { display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 28px;border-top:1px solid var(--line);background:var(--surface);font-size:11px;color:var(--muted) }
      .drawer-footer button { font-size:13px }
      .doc-tabs { display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px }
      .doc-tabs button { font-size:12px }
      .doc-tabs button.active { color:var(--brand);background:var(--brand-soft);border-color:#bdd8fd }
      .version { font-size:11px;color:var(--brand);background:var(--brand-soft);padding:2px 5px;border-radius:4px;margin-left:7px }
      .popover { position:fixed;z-index:20;min-width:150px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 9px 25px #15283b22 }
      .popover button { display:block;width:100%;text-align:left;border:0;background:transparent;font-size:12px }
      .popover button:hover { background:var(--soft) }
      .popover-backdrop { position:fixed;inset:0;z-index:19 }
      .toast { position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:50;max-width:90%;background:#243248;color:#fff;border-radius:9px;box-shadow:0 8px 30px #17202a25;padding:12px 18px;font-size:13px;animation:fade .15s;white-space:normal }
      @keyframes slide {
        from { transform:translateX(35px);opacity:.5 }
        to { transform:translateX(0);opacity:1 }
      }
      @keyframes fade {
        from { opacity:0 }
        to { opacity:1 }
      }
      @media(min-width:1500px) {
        .shell { padding-top:28px }
        .page-heading { padding-top:38px;padding-bottom:30px }
        td { height:84px }
      }
      @media(max-width:1100px) {
        .shell { width:calc(100% - 40px) }
        th, td { padding-left:13px;padding-right:13px }
        .toolbar-end { display:none }
        table { min-width:870px }
        .heading-meta { display:none }
      }
      @media(max-width:650px) {
        .shell { width:calc(100% - 28px);padding-top:12px }
        .topbar { height:53px;padding:0 10px;border-radius:10px }
        .page-heading { padding:26px 2px 22px;gap:5px }
        h1 { font-size:25px }
        .page-heading p { font-size:12px;margin-top:7px }
        .workspace { background:transparent;border:0;box-shadow:none;border-radius:0;overflow:visible }
        .workspace-tabs { padding:0;height:48px;border-bottom:1px solid var(--line) }
        .tabs { gap:24px }
        .tab { font-size:14px }
        .refresh { padding:0 4px }
        .toolbar { padding:17px 0 15px;gap:8px;flex-wrap:wrap }
        .search { flex:1;width:auto }
        .search input { height:44px;background:var(--surface);border:1px solid var(--line);font-size:13px;padding-left:35px }
        .search-mark { top:14px }
        .search-clear { top:5px }
        .filter-toggle { display:block;min-height:44px;padding:0 13px;background:var(--surface) }
        .toolbar select { display:none;flex:1;min-width:0;height:44px }
        .toolbar.filters-open select { display:block }
        .toolbar.filters-open .search { flex-basis:calc(100% - 75px) }
        .filter-reset { display:none }
        .table-scroll { display:none }
        .employee-card { padding:17px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:11px }
        .card-top { display:flex;justify-content:space-between;align-items:center }
        .card-top .person { gap:10px }
        .card-top .name { font-size:16px;min-height:28px }
        .employee-card .avatar { width:38px;height:38px }
        .card-meta { display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-top:3px }
        .card-phone { display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px;font-size:13px }
        .card-docs { display:flex;align-items:center;justify-content:space-between;background:var(--soft);padding:11px 10px;border-radius:6px;font-size:11px }
        .card-docs button { min-height:22px }
        .card-footer { display:flex;align-items:center;justify-content:space-between;margin-top:11px;border-top:1px solid var(--line);height:44px;font-size:11px;color:var(--muted) }
        .card-footer button { min-height:42px }
        .foot { padding:17px 0;align-items:center;border:0;font-size:11px }
        .pagination select { display:none }
        .pagination { gap:5px }
        .pagination button { min-height:40px }
        .footer-note { font-size:10px;line-height:1.7;padding-top:4px }
        .footer-note span:last-child { display:none }
        .info-grid { gap:24px 16px }
        .drawer-footer { padding:14px 20px }
        .drawer-footer>span { max-width:150px;line-height:1.6 }
        .drawer-footer button { min-height:44px }
        .topbar button { min-height:40px }
        .doc-tabs button { min-height:44px }
        .toast { bottom:18px;font-size:12px }
        .popover button { min-height:44px }
        .empty { background:var(--surface);border-radius:12px }
        .info-cell .mono { font-size:13px }
        .info-cell.full .flex { flex-wrap:wrap }
      }
      @media(prefers-reduced-motion:reduce) {
        *, *:before, *:after { animation:none!important;transition:none!important }
      }
      @media(min-width:651px) {
        .shell { padding-top:18px }
        .topbar { height:54px }
        .page-heading { padding:22px 2px 21px }
        .workspace-tabs { height:54px }
        .toolbar { padding:16px 23px }
      }
      @media(max-width:650px) {
        .employee-card .name, .employee-card .more, .card-docs .doc-link { min-height:44px }
        .card-docs { padding-top:0;padding-bottom:0 }
        .card-top .name { padding-top:0;padding-bottom:0 }
        .card-footer { height:48px }
        .card-footer button { min-height:44px }
      }
      body.switcher-open { overflow: hidden; }
      body.switcher-open .topbar { z-index: 21; }
      .topbar { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); box-shadow: 0 12px 32px rgba(30, 70, 120, .08); backdrop-filter: blur(20px); }
      .center-switcher { position: relative; z-index: 22; }
      .center-switcher-trigger { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 7px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); font-size: 15px; font-weight: 700; cursor: pointer; }
      .center-switcher-trigger:hover { background: var(--soft); }
      .center-switcher-trigger:focus-visible { outline: 3px solid var(--brand-soft); outline-offset: 2px; }
      .center-switcher-trigger .center-icon { width: 22px; height: 22px; color: var(--brand); }
      .center-switcher-chevron { width: 15px; height: 15px; transition: transform .18s ease; }
      .center-switcher-chevron[hidden] { display: none; }
      .center-switcher.is-open .center-switcher-chevron { transform: rotate(180deg); }
      .center-switcher-backdrop { position: fixed; z-index: 20; inset: 0; border: 0; background: rgba(17, 24, 39, .28); backdrop-filter: blur(2px); cursor: default; }
      .center-switcher-menu { position: absolute; z-index: 22; top: calc(100% + 10px); left: 0; width: min(286px, calc(100vw - 32px)); padding: 8px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: 0 24px 60px rgba(20, 31, 50, .22); }
      .center-switcher-option { display: grid; grid-template-columns: 30px 1fr 20px; align-items: center; gap: 12px; min-height: 62px; padding: 0 14px; border-radius: 14px; color: var(--ink); font-size: 16px; font-weight: 650; text-decoration: none; }
      .center-switcher-option:hover, .center-switcher-option:focus-visible { background: var(--soft); outline: none; }
      .center-switcher-option[aria-current="page"] { background: var(--brand-soft); }
      .center-switcher-option svg { width: 27px; height: 27px; }
      .center-switcher-option[data-center="expense"] svg { color: #3478f6; }
      .center-switcher-option[data-center="invoice"] svg { color: #34b978; }
      .center-switcher-option[data-center="staff"] svg { color: #f0a52b; }
      .center-switcher-option[data-management] svg { color: #a78bfa; }
      .center-switcher-check { color: var(--brand); font-size: 22px; font-weight: 800; text-align: center; }
      .topbar-actions { display: flex; align-items: center; gap: 6px; }
      .logout-form { margin: 0; }
      .topbar-actions button { min-height: 36px; border-radius: 10px; }
      .theme-toggle { display: inline-flex; align-items: center; justify-content: center; width: 36px; min-width: 36px; padding: 0; flex: 0 0 36px; border-color: transparent; background: var(--soft); }
      .theme-icon { display: grid; place-items: center; width: 24px; height: 24px; font-family: "Apple Color Emoji", "Segoe UI Emoji", sans-serif; font-size: 20px; line-height: 1; }
      .logout-button { display: inline-flex; align-items: center; gap: 6px; padding: 0 9px; border-color: transparent; background: var(--soft); font-size: 14px; white-space: nowrap; }
      .logout-button svg { width: 18px; height: 18px; }
      .center-switcher-trigger:disabled { opacity: 1; color: inherit; cursor: default; }
      .center-switcher-option[data-center="store"] svg { color: #e85d8e; }
      :root[data-theme="dark"] .center-switcher-option[data-center="store"] svg { color: #f486ad; }
      [hidden] { display: none !important; }
      .topbar { position: relative; z-index: 2; box-shadow: var(--shadow); background: var(--surface); }
      .topbar-actions { margin-left: auto; }
      .theme-icon { font-size: 18px; }
      .center-switcher-trigger .center-icon { background: var(--brand-soft); border-radius: 8px; padding: 5px; width: 32px; height: 32px; }
      .count:empty { display: none; }
      .toolbar { margin: 0; }
      .toolbar input[type="search"] { appearance: none; -webkit-appearance: none; }
      .toolbar select, .field select { appearance: auto; -webkit-appearance: menulist; }
      .status { font-size: 12px; color: var(--muted); margin: 0; }
      .status.error { color: var(--danger); }
      .notice-line:has(.status:empty) { display: none; }
      .notice-line { display: flex; align-items: center; gap: 12px; padding: 0 23px 14px; }
      .records-cards { display: none; }
      .store-dot.fuzzy_qz { background: #a18ac9; }
      .store-copy { display: grid; gap: 5px; }
      .store-copy .muted { font-size: 11px; padding-left: 13px; }
      .doc-link { display: grid; gap: 7px; }
      .doc-line { display: flex; align-items: center; gap: 5px; }
      .doc-line .doc-ok { margin: 0; }
      .doc-sub { margin: 0; }
      .tag { display: inline-flex; font-size: 11px; border-radius: 5px; padding: 3px 6px; background: var(--soft); color: var(--muted); }
      .tag.deleted { color: var(--danger); }
      .record-id { display: flex; align-items: center; gap: 7px; margin-top: 6px; }
      .record-id .subline { margin: 0; }
      .table-date { white-space: pre-line; line-height: 1.7; font-size: 12px; }
      .modal { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: flex-end; background: #182c4440; }
      body.modal-open { overflow: hidden; }
      .dialog { display: flex; flex-direction: column; width: min(590px, 100%); height: 100%; background: var(--surface); box-shadow: -15px 0 60px #132b441f; animation: slide .2s; min-width: 0; }
      .dialog-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; min-height: 64px; border-bottom: 1px solid var(--line); gap: 14px; flex-shrink: 0; }
      .dialog-header h2 { font-size: 18px; }
      .dialog-header p { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.7; }
      .dialog-body { padding: 26px 28px; overflow: auto; flex: 1; min-height: 0; }
      .detail-person { padding: 22px 28px; display: flex; align-items: center; gap: 12px; }
      .detail-person .avatar { width: 48px; height: 48px; font-size: 20px; background: var(--brand-soft); color: var(--brand); }
      .detail-person h2 { font-size: 22px; }
      .detail-person p { color: var(--muted); font-size: 12px; margin-top: 7px; }
      .detail-version { margin-left: auto; font-size: 12px; color: var(--muted); }
      .detail-tabs { padding: 0 28px; height: 48px; flex-shrink: 0; border-bottom: 1px solid var(--line); }
      .detail-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
      .detail-value { font-size: 14px; overflow-wrap: anywhere; }
      .sensitive-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .sensitive-row button { font-size: 11px; min-height: 28px; padding: 0 6px; color: var(--brand); border: 0; }
      .field { display: grid; gap: 8px; min-width: 0; }
      .field label { color: var(--muted); font-size: 12px; }
      .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 16px; }
      .section-heading { font-size: 14px; margin: 28px 0 18px; }
      .attachment-list { display: grid; gap: 14px; }
      .file-field { display: grid; gap: 8px; min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: 8px; }
      .file-field strong { font-size: 13px; font-weight: 500; }
      .file-field .muted { font-size: 11px; overflow-wrap: anywhere; }

      .preview-modal .dialog-header > div { min-width: 0; flex: 1; }
      .preview-modal h2 { overflow-wrap: anywhere; }
      .preview-body { flex: 1; overflow: auto; min-height: 220px; padding: 18px; background: var(--soft); display: grid; align-content: center; justify-items: center; }
      .preview-body img, .preview-body canvas { max-width: 100%; max-height: 68vh; object-fit: contain; }
      .preview-body iframe { width: 100%; height: 60vh; border: 0; background: white; }
      .preview-status { color: var(--muted); font-size: 13px; padding: 22px; text-align: center; line-height: 1.8; }
      .download-link { display: inline-block; color: var(--brand); font-size: 12px; margin-top: 10px; overflow-wrap: anywhere; }

etail-edit" class="primary" type="button" hidden>编辑资料</button><button id="detail-restore" class="primary" type="button" hidden>恢复资料</button></div></footer></section></div>

健康证</label></div></div></form></div><div class="dialog-actions"><button data-close="edit-modal" type="button">取消</button><button id="edit-submit" form="edit-form" class="button-primary" type="submit">保存新版本</button></div></section></div>

    <div class="modal preview-modal" id="preview-modal" hidden><section class="dialog dialog-wide" role="dialog" aria-modal="true" aria-labelledby="preview-title"><header class="dialog-header"><div><h2 id="preview-title">附件预览</h2><p id="preview-meta"></p><a class="download-link" id="preview-download" href="#" download>下载原文件</a></div><button data-close="preview-modal" type="button">关闭</button></header><div class="preview-body"><div class="preview-status" id="preview-status">正在加载附件...</div><img id="preview-image" alt="附件预览" hidden><canvas id="preview-pdf-canvas" aria-label="PDF 首页预览" hidden></canvas><iframe id="preview-frame" title="PDF 附件预览" sandbox hidden></iframe></div></section></div>

    <script>
      (() => {
        const THEME_STORAGE_KEY = "comeover-admin-theme";
        const STORE_LABELS = { fuzzy: "Fuzzy", fuzzy_qz: "Fuzzy泉州店", peanut: "Peanut" };
        const POSITION_LABELS = { front_of_house: "前厅", back_of_house: "后厨" };
        const ACTION_LABELS = { created: "员工提交", updated: "资料编辑", deleted: "移入回收站", restored: "从回收站恢复" };
        const state = { search: "", storeKey: "", status: "active", limit: 50, offset: 0, total: 0, items: [], loading: false };
        const body = document.getElementById("records-body");
        const statusText = document.getElementById("status-text");
        const emptyState = document.getElementById("empty-state");
        const prevButton = document.getElementById("prev-button");
        const nextButton = document.getElementById("next-button");
        const summaryCount = document.getElementById("summary-count");
        const summaryRange = document.getElementById("summary-range");
        const editForm = document.getElementById("edit-form");
        const themeToggle = document.getElementById("theme-toggle");
        const themeIcon = document.getElementById("theme-icon");
        const centerSwitcher = document.getElementById("center-switcher");
        const centerSwitcherTrigger = document.getElementById("center-switcher-trigger");
        const centerSwitcherChevron = document.getElementById("center-switcher-chevron");
        const centerSwitcherMenu = document.getElementById("center-switcher-menu");
        const centerSwitcherBackdrop = document.getElementById("center-switcher-backdrop");
        const previews = { preview: { generation: 0, url: "" }, document: { generation: 0, url: "" } };
        let listGeneration = 0, detailGeneration = 0, editGeneration = 0;
        let detailItem = null, selectedDocument = "idCardFront", editDirty = false, editSaving = false;
        let searchTimer, toastTimer, resolveConfirmation;
        const modalFocus = new Map();
        const ATTACHMENT_LABELS = { idCardFront: "身份证正面", idCardBack: "身份证反面", healthCertificate: "健康证" };
        let pdfJsModulePromise;

        function closeCenterSwitcher({ restoreFocus = false } = {}) { centerSwitcher.classList.remove("is-open"); centerSwitcherTrigger.setAttribute("aria-expanded", "false"); centerSwitcherMenu.hidden = true; centerSwitcherBackdrop.hidden = true; document.body.classList.remove("switcher-open"); if (restoreFocus) centerSwitcherTrigger.focus(); }
        function openCenterSwitcher() { if (centerSwitcherTrigger.disabled) return; centerSwitcher.classList.add("is-open"); centerSwitcherTrigger.setAttribute("aria-expanded", "true"); centerSwitcherMenu.hidden = false; centerSwitcherBackdrop.hidden = false; document.body.classList.add("switcher-open"); centerSwitcherMenu.querySelector("[aria-current='page']")?.focus(); }

      async function loadAuthorizedCenters(container, trigger, menu, currentApp) {
        container.hidden = false;
        trigger.disabled = true;
        trigger.querySelector(".center-switcher-chevron")?.setAttribute("hidden", "");
        try {
          const response = await fetch("/auth/api/session", { headers: { Accept: "application/json" } });
          const payload = await response.json();
          if (!response.ok) return;
          const allowed = payload.apps || [];
          for (const link of menu.querySelectorAll("[data-center]")) {
            link.hidden = !allowed.includes(link.dataset.center);
            if (payload.destinations?.[link.dataset.center]) link.href = payload.destinations[link.dataset.center];
          }
          if (payload.canManageAccounts && !menu.querySelector('[data-management]')) {
            const link = document.createElement("a");
            link.href = "/auth/accounts";
            link.className = "center-switcher-option";
            link.dataset.management = "true";
            link.setAttribute("role", "menuitem");
            link.innerHTML = '<svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9.5" r="4.25" fill="currentColor" fill-opacity=".16"/><path d="M4.5 25.5c.65-5.8 3.15-8.5 7.5-8.5 3.25 0 5.45 1.5 6.65 4.55"/><circle cx="23.25" cy="22.75" r="3.25" fill="currentColor" fill-opacity=".16"/><path d="M23.25 17.5v1.15M23.25 26.85V28M18 22.75h1.15M27.35 22.75h1.15M19.55 19.05l.8.8M26.15 25.65l.8.8M26.95 19.05l-.8.8M20.35 25.65l-.8.8"/><circle cx="23.25" cy="22.75" r="1.05" fill="currentColor" stroke="none"/></svg><span>账号管理</span><span></span>';
            menu.appendChild(link);
          }
          trigger.disabled = allowed.filter((app) => app !== currentApp).length === 0 && !payload.canManageAccounts;
        } catch { /* Keep the current center label, with switching disabled. */ }
        const arrow = trigger.querySelector(".center-switcher-chevron");
        if (arrow) arrow.hidden = trigger.disabled;
      }

      async function enableCenterSwitcherForAdmin() {
        await loadAuthorizedCenters(centerSwitcher, centerSwitcherTrigger, centerSwitcherMenu, "staff");
        centerSwitcherChevron.toggleAttribute("hidden", centerSwitcherTrigger.disabled);
      }

        function readSavedTheme() {
          try {
            const savedTheme = window.localStorage.getItem(THEME_STORAGE_KEY) ?? window.localStorage.getItem("employee-portal-theme");
            return savedTheme === "light" || savedTheme === "dark" ? savedTheme : null;
          } catch {
            return null;
          }
        }

        function applyTheme(theme, persist = false) {
          const normalizedTheme = theme === "dark" ? "dark" : "light";
          document.documentElement.dataset.theme = normalizedTheme;
          document.documentElement.style.colorScheme = normalizedTheme;
          themeIcon.textContent = normalizedTheme === "dark" ? "☀️" : "🌙";
          themeToggle.setAttribute("aria-label", normalizedTheme === "dark" ? "切换到浅色模式" : "切换到深色模式");
          themeToggle.setAttribute("aria-pressed", String(normalizedTheme === "dark"));
          if (persist) {
            try { window.localStorage.setItem(THEME_STORAGE_KEY, normalizedTheme); } catch { /* Ignore. */ }

          const attachment = detailItem.attachments[key];
          resetPreview("document"); document.getElementById("document-meta").textContent = "";
          const status = document.getElementById("document-status"); status.hidden = false;
          if (!can("attachment:view")) { status.textContent = "当前账号没有查看附件的权限。"; return; }
          if (!attachment) { status.textContent = key === "healthCertificate" ? "健康证暂未上传，为选填资料。" : "该证件未上传。"; return; }
          void loadPreview(attachmentButton(attachment, ATTACHMENT_LABELS[key]), "document");
        }
        async function openEdit(id) {
          if (!can("employee:edit") || editSaving) return;
          const generation = ++editGeneration, feedback = document.getElementById("edit-feedback");
          feedback.hidden = true; editDirty = false; editForm.reset();
          try {
            const payload = await requestJson(`/staff/api/admin/submissions/${encodeURIComponent(id)}`);
            if (generation !== editGeneration) return;
            const item = payload.item; if (item.deletedAt) throw new Error("已删除记录需要先恢复后才能编辑。");
            document.getElementById("edit-id").value = item.id;
            document.getElementById("edit-name").value = item.name; document.getElementById("edit-phone").value = item.phone;
            document.getElementById("edit-position").value = item.position || ""; document.getElementById("edit-store").value = item.storeKey;
            document.getElementById("edit-front-current").textContent = item.attachments.idCardFront?.originalName || "未上传";
            document.getElementById("edit-back-current").textContent = item.attachments.idCardBack?.originalName || "未上传";
            document.getElementById("edit-health-current").textContent = item.attachments.healthCertificate?.originalName || "未上传";
            document.getElementById("remove-health-row").hidden = !item.attachments.healthCertificate;
            closeModal("detail-modal", { force: true }); openModal("edit-modal");
          } catch (error) { notify(error.message); }
        }
        editForm.addEventListener("input", () => { editDirty = true; });
        editForm.addEventListener("change", () => { editDirty = true; });
        editForm.addEventListener("submit", async (event) => {
          event.preventDefault(); if (!can("employee:edit") || editSaving) return;
          const id = document.getElementById("edit-id").value, feedback = document.getElementById("edit-feedback"), button = document.getElementById("edit-submit");
          feedback.hidden = true; editSaving = true; button.disabled = true; button.textContent = "保存中…";
          const formData = new FormData(editForm);
          // Prevent edits from being lost while the submitted snapshot is being saved.
          const controls = [...editForm.querySelectorAll("input, select")]; controls.forEach(control => { control.disabled = true; });
          try {
            await requestJson(`/staff/api/admin/submissions/${encodeURIComponent(id)}`, { method: "PATCH", body: formData });
            closeModal("edit-modal", { force: true }); notify("已保存新版本，历史资料保持不变。");
            await loadRecords();
            if (can("employee:view")) await openDetail(id);
          } catch (error) { feedback.textContent = error.message; feedback.hidden = false; }
          finally { editSaving = false; button.disabled = false; button.textContent = "保存新版本"; controls.forEach(control => { control.disabled = false; }); }
        });
        const mutating = new Set();
        async function changeRecord(id, restore = false) {
          const permission = restore ? "employee:restore" : "employee:delete";
          if (!can(permission) || mutating.has(id)) return;
          const item = detailItem?.id === id ? detailItem : state.items.find(entry => entry.id === id);
          if (!item) return;
          const accepted = await askConfirmation(restore ? "恢复员工资料？" : "移入回收站？", restore ? `将恢复 ${item.name} 的资料，所有历史版本保持不变。` : `${item.name} 的记录将移入回收站。资料和全部历史附件会保留，可随时恢复。`, restore ? "恢复资料" : "移入回收站");
          if (!accepted || !can(permission) || mutating.has(id)) return;
          mutating.add(id);
          try {
            await requestJson(`/staff/api/admin/submissions/${encodeURIComponent(id)}${restore ? "/restore" : ""}`, { method: restore ? "POST" : "DELETE" });
            if (detailItem?.id === id) closeModal("detail-modal", { force: true });
            notify(restore ? "记录已恢复。" : "记录已移入回收站。"); await loadRecords();
          } catch (error) { notify(error.message); }
          finally { mutating.delete(id); }
        }
        async function loadPreview(button, prefix) {
          if (!can("attachment:view")) return;
          resetPreview(prefix);
          const slot = previews[prefix], generation = slot.generation; slot.controller = new AbortController();
          const current = () => generation === slot.generation;
          const status = document.getElementById(`${prefix}-status`), image = document.getElementById(`${prefix}-image`), canvas = document.getElementById(`${prefix}-pdf-canvas`), frame = document.getElementById(`${prefix}-frame`), download = document.getElementById(`${prefix}-download`);
          status.hidden = false; status.textContent = "正在加载附件…";
          const title = button.dataset.previewName || "附件预览";
          if (prefix === "preview") document.getElementById("preview-title").textContent = title;
          document.getElementById(`${prefix}-meta`).textContent = `${title} · ${button.dataset.previewType || ""} · ${formatBytes(Number(button.dataset.previewSize))}`;
          try {
            const response = await fetch(button.dataset.previewUrl, { signal: slot.controller.signal });
            if (!response.ok) { const payload = await response.json().catch(() => ({})); throw new Error(payload?.error?.message || "附件加载失败"); }
            const blob = await response.blob(); if (!current()) return;
            slot.url = URL.createObjectURL(blob); download.href = slot.url; download.download = title; download.hidden = false;
            const type = (response.headers.get("content-type") || blob.type || button.dataset.previewType || "").split(";")[0];
            if (type === "application/pdf") {
              const detached = document.createElement("canvas");
              try {
                await renderPdfPreview(blob, detached, canvas.parentElement.clientWidth); if (!current()) return;
                canvas.width = detached.width; canvas.height = detached.height; canvas.getContext("2d").drawImage(detached, 0, 0); canvas.hidden = false;
              } catch { if (!current()) return; frame.src = slot.url; frame.hidden = false; }
              status.hidden = true;
            } else if (type === "image/jpeg" || type === "image/png") {
              image.src = slot.url;
              try { await image.decode(); } catch { if (current()) throw new Error("图片无法解码，请下载原文件查看。"); }
              if (!current()) return; image.hidden = false; status.hidden = true;
            } else status.textContent = "当前浏览器可能无法预览 HEIC/HEIF，请使用“下载原文件”。";
          } catch (error) { if (current() && error.name !== "AbortError") { status.hidden = false; status.textContent = error.message; } }
        }
        async function openPreview(button) { if (!can("attachment:view")) return; openModal("preview-modal"); await loadPreview(button, "preview"); }
        function applyFilters() {
          clearTimeout(searchTimer);
          state.search = document.getElementById("search").value.trim(); state.storeKey = document.getElementById("store-key").value; state.offset = 0; void loadRecords();
        }
        function resetFilters() { document.getElementById("search").value = ""; document.getElementById("store-key").value = ""; applyFilters(); }
        document.getElementById("filter-form").addEventListener("submit", event => { event.preventDefault(); applyFilters(); });
        document.getElementById("search").addEventListener("input", event => { clearTimeout(searchTimer); document.getElementById("clear-search").hidden = !event.target.value; if (!event.isComposing) searchTimer = setTimeout(applyFilters, 300); });
        document.getElementById("search").addEventListener("compositionend", () => { clearTimeout(searchTimer); searchTimer = setTimeout(applyFilters, 300); });
        document.getElementById("store-key").addEventListener("change", applyFilters);
        document.getElementById("limit").addEventListener("change", event => { state.limit = Number(event.target.value); state.offset = 0; void loadRecords(); });
        document.getElementById("reset-filters").addEventListener("click", resetFilters); document.getElementById("empty-reset").addEventListener("click", resetFilters);
        document.getElementById("clear-search").addEventListener("click", () => { document.getElementById("search").value = ""; applyFilters(); document.getElementById("search").focus(); });
        document.getElementById("filter-toggle").addEventListener("click", event => { const open = document.getElementById("filter-form").classList.toggle("filters-open"); event.currentTarget.setAttribute("aria-expanded", String(open)); });
        document.querySelectorAll("[data-status]").forEach(button => button.addEventListener("click", () => { state.status = button.dataset.status; applyFilters(); }));
        document.getElementById("refresh-button").addEventListener("click", loadRecords);
        prevButton.addEventListener("click", () => { if (!state.loading) { state.offset = Math.max(0, state.offset - state.limit); void loadRecords(); } });
        nextButton.addEventListener("click", () => { if (!state.loading) { state.offset += state.limit; void loadRecords(); } });
        document.getElementById("detail-edit").addEventListener("click", () => { if (detailItem) void openEdit(detailItem.id); });
        document.getElementById("detail-restore").addEventListener("click", () => { if (detailItem) void changeRecord(detailItem.id, true); });
        document.getElementById("detail-copy-phone").addEventListener("click", () => { if (detailItem) void copyText(detailItem.phone); });
        document.getElementById("row-menu-backdrop").addEventListener("click", closeRowMenu);
        window.addEventListener("resize", closeRowMenu);
        document.getElementById("confirm-cancel").addEventListener("click", () => finishConfirmation(false));
        document.getElementById("confirm-accept").addEventListener("click", () => finishConfirmation(true));
        document.querySelectorAll("[data-detail-tab]").forEach(button => button.addEventListener("click", () => selectDetailTab(button.dataset.detailTab)));
        document.querySelector(".detail-tabs").addEventListener("keydown", event => {
          if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
          const tabs = [...document.querySelectorAll("[data-detail-tab]")], index = tabs.indexOf(document.activeElement); if (index < 0) return;
          const next = event.key === "Home" ? 0 : event.key === "End" ? tabs.length - 1 : (index + (event.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
          event.preventDefault(); selectDetailTab(tabs[next].dataset.detailTab); tabs[next].focus();
        });
        document.addEventListener("click", event => {
          const close = event.target.closest("[data-close]"); if (close) { closeModal(close.dataset.close); return; }
          const preview = event.target.closest("[data-preview-url]"); if (preview) { void openPreview(preview); return; }
          const action = event.target.closest("[data-action]"); if (!action) return;
          const { action: kind, id } = action.dataset;
          if (kind !== "more") closeRowMenu();
          if (kind === "detail" || kind === "documents" || kind === "history") void openDetail(id, kind === "detail" ? "basic" : kind);
          if (kind === "edit") void openEdit(id);
          if (kind === "delete" || kind === "restore") void changeRecord(id, kind === "restore");
          if (kind === "more") { const item = state.items.find(entry => entry.id === id); if (item) openRowMenu(action, item); }
          if (kind === "current-document") { selectedDocument = id; selectDetailTab("documents"); }
        });
        document.querySelectorAll(".modal").forEach(modal => modal.addEventListener("click", event => { if (event.target === modal) { if (modal.id === "confirm-modal") finishConfirmation(false); else closeModal(modal.id); } }));
        document.addEventListener("keydown", event => {
          const modal = topModal();
          if (event.key === "Escape") {
            if (modal) { event.preventDefault(); if (modal.id === "confirm-modal") finishConfirmation(false); else closeModal(modal.id); }
            else { const trigger = document.querySelector('[data-action="more"][aria-expanded="true"]'); closeRowMenu(); trigger?.focus(); }
          }
          if (event.key === "Tab" && modal) {
            const controls = [...modal.querySelectorAll('button:not(:disabled), input:not(:disabled), select:not(:disabled), a[href], summary, [tabindex="0"]')].filter(control => control.getClientRects().length);
            const first = controls[0], last = controls.at(-1);
            if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
            else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
          }
        });
        window.addEventListener("beforeunload", event => { if (editDirty || editSaving) { event.preventDefault(); event.returnValue = ""; } });

        const systemThemePreference = window.matchMedia("(prefers-color-scheme: dark)");
        applyTheme(document.documentElement.dataset.theme || (systemThemePreference.matches ? "dark" : "light"));
        themeToggle.addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true));
        window.addEventListener("storage", (event) => {
          if (event.key === THEME_STORAGE_KEY && (event.newValue === "light" || event.newValue === "dark")) applyTheme(event.newValue);
        });
        systemThemePreference.addEventListener("change", (event) => { if (!readSavedTheme()) applyTheme(event.matches ? "dark" : "light"); });
        centerSwitcherTrigger.addEventListener("click", () => { if (centerSwitcher.classList.contains("is-open")) closeCenterSwitcher(); else openCenterSwitcher(); });
        centerSwitcherBackdrop.addEventListener("click", () => closeCenterSwitcher({ restoreFocus: true }));
        document.addEventListener("keydown", (event) => { if (event.key === "Escape" && centerSwitcher.classList.contains("is-open")) closeCenterSwitcher({ restoreFocus: true }); });
        void enableCenterSwitcherForAdmin();
        loadRecords();
      })();
    </script>
  </body>
</html>
