*{box-sizing:border-box}body{margin:0;background:#edf0f4;color:#1c1c1e;font:14px/1.7 -apple-system,"PingFang SC",sans-serif}main{max-width:1030px;margin:auto;padding:30px 26px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}h1{margin:0 0 5px;font-size:26px;letter-spacing:-.6px}p{margin:0;color:#6e6e73}button,a{font:inherit}button{padding:8px 12px;border:1px solid #cbd4df;border-radius:10px;background:white;color:#1c1c1e;cursor:pointer;white-space:nowrap}.pair{display:grid;grid-template-columns:1fr 1fr;gap:36px;justify-items:center}.option{width:100%;max-width:390px}.label{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.label strong{font-size:16px}.label small{color:#6e6e73}.screen{height:620px;border:1px solid #cbd4df;border-radius:16px;background:white;overflow:hidden;box-shadow:0 14px 40px #14223912}iframe{display:block;width:100%;height:100%;border:0}.metric{font-size:12px;margin-top:10px}.notes{margin-top:25px;border:1px solid #d8dfe8;border-radius:14px;padding:16px 20px;background:#ffffffb3}.notes p{margin-top:5px}.notes a{color:#007aff;text-decoration:none;display:inline-block;margin-top:12px}footer{font-size:12px;color:#6e6e73;margin-top:20px}.tabs{display:none}.recommended{color:#007aff}@media(max-width:740px){main{padding:20px 14px}h1{font-size:22px}header p{font-size:12px}header{align-items:flex-start}.pair{display:block}.option{margin:auto}.option.before{display:none}.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:16px}.tabs .active{background:#007aff;color:white;border-color:#007aff}.screen{height:650px}}
</style></head><body><main><header><div><h1>手机条目，信息更集中。</h1><p>去掉头像、编号和底部操作栏，增加完整身份证号。</p></div><button id="theme" type="button">切换深色</button></header><nav class="tabs" aria-label="对比版本"><button data-show="before">当前</button><button data-show="after" class="active">紧凑版</button></nav><div class="pair"><section class="option before"><div class="label"><strong>当前条目</strong><small>底部独立操作栏</small></div><div class="screen"><iframe id="before" src="/before" title="当前手机条目"></iframe></div><p class="metric" id="before-size"></p></section><section class="option after"><div class="label"><strong class="recommended">建议 · 紧凑条目</strong><small>右上角更多操作</small></div><div class="screen"><iframe id="after" src="/staff" title="紧凑手机条目"></iframe></div><p class="metric" id="after-size"></p></section></div><section class="notes"><strong>姓名、门店和岗位集中在顶部，号码与证件顺序清晰。</strong><p>点条目可直接查看详情；右上角“···”提供查看、编辑、历史和回收站等原有操作。提交时间保留为一行小字，不再占用独立操作栏。手机端展示完整手机号和身份证号。</p><a href="/staff" target="_blank">打开完整交互预览 ↗</a></section><footer>效果图确认稿 · 虚构员工和附件 · 方案已部署，此处为独立虚构数据预览</footer></main><script>
const frames=[document.getElementById('before'),document.getElementById('after')];function focusCards(f){const card=f.contentDocument?.querySelector('#records-cards article');if(!card){setTimeout(()=>focusCards(f),80);return;}f.contentWindow.scrollTo(0,card.getBoundingClientRect().top+f.contentWindow.scrollY-12);document.getElementById(f.id+'-size').textContent='单条高度 '+Math.round(card.getBoundingClientRect().height)+'px';}frames.forEach(f=>f.addEventListener('load',()=>focusCards(f)));let dark=false;document.getElementById('theme').onclick=()=>{dark=!dark;frames.forEach(f=>f.contentWindow.dispatchEvent(new f.contentWindow.StorageEvent('storage',{key:'staff-mobile-compact-theme',newValue:dark?'dark':'light'})));document.getElementById('theme').textContent=dark?'切换浅色':'切换深色';};document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-show]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.option').forEach(x=>x.style.display=x.classList.contains(b.dataset.show)?'block':'none');focusCards(document.getElementById(b.dataset.show));});
</script></body></html>
